<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Fortes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="v.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1>Gerador de Senhas Fortes</h1>
        
        <div class="password-display-container">
            <input type="text" id="passwordDisplay" readonly placeholder="Sua senha será exibida aqui">
            <button id="copyPassword" title="Copiar senha">
                <img src="copia-de.png"/>

            </button>
            <div id="copyMessage" class="copy-message">Copiado!</div>
        </div>
        
        <div class="options">
            <div class="option-group">
                <label for="passwordLength">Comprimento da Senha:</label>
                <input type="range" id="passwordLength" min="8" max="128" value="12">
                <span id="lengthValue">12</span>
            </div>

            <div class="option-group checkbox-group">
                <input type="checkbox" id="includeUppercase" checked>
                <label for="includeUppercase">Incluir letras maiúsculas</label>
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="includeLowercase" checked>
                <label for="includeLowercase">Incluir letras minúsculas</label>
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="includeNumbers" checked>
                <label for="includeNumbers">Incluir números</label>
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="includeSymbols">
                <label for="includeSymbols">Incluir símbolos</label>
            </div>
        </div>
        
        <button id="generatePassword">Gerar Senha</button>
        <div class="password-strength">
            Força da Senha: <span id="strengthIndicator"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
